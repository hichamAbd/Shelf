<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Shelf</title>
<meta name="description" content="A home page that lists my apps.">
<meta name="theme-color" content="#fafafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shelf">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="page">
  <header class="top">
    <div class="top-text">
      <h1>Shelf</h1>
      <p class="lede">The apps you've made.</p>
    </div>
    <svg class="mark" viewBox="0 0 72 44" aria-hidden="true" focusable="false">
      <rect class="mark-a" x="8" y="6" width="13" height="38" rx="4"/>
      <rect class="mark-b" x="26" y="20" width="13" height="24" rx="4"/>
      <rect class="mark-c" x="47" y="12" width="13" height="32" rx="4" transform="rotate(-13 47 44)"/>
    </svg>
  </header>

  <ul id="apps" class="apps" aria-label="Your apps"></ul>

  <noscript><p class="note">Shelf needs JavaScript to show the list.</p></noscript>
  <p class="note">Nothing is stored or sent. Works offline once opened.</p>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
